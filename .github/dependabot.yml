# ID-CRASH-0036 (2026-09-28 code-review P2-17): dependabot.yml for the
# ClipMemory repo. The audit flagged the absence of any automated
# dependency-update channel ("无 .github/dependabot.yml、无
# renovate.json") — version drift between project.yml's Sparkle pin
# (2.9.5) and release.yml's CLI-tools pin (2.9.4, ID-CRASH-0024) was
# the proximate cause of P2-15.
#
# Scope: SPM dependencies only (the project uses project.yml + XcodeGen,
# not Package.swift). GitHub Actions are referenced by mutable major tags
# (0 SHA pins as of code-review-2026-10-01 五-5 — the earlier "pinned by
# SHA" claim here was stale); dependabot's github-actions ecosystem still
# proposes tag-level bumps. Carthage/CocoaPods are not used.
#
# Cadence: weekly. Sparkle is the only SPM dep and it's pinned at major
# 2.x with breaking sign_update API contracts every ~6 months (per
# release.yml:289-291) — weekly checks surface minor bumps quickly; major
# bumps still need human approval per the Sparkle contract.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are NOT SHA-pinned (see header note): dependabot proposes
    # tag-level bumps. Keep the release.yml workflow (contents:write +
    # admin PAT) as the priority for the SHA-pinning tracked in
    # code-review-2026-10-01 五-5.
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    # Dependabot reads the committed project.pbxproj (XcodeGen artifact)
    # and bumps pbxproj + Package.resolved — it does NOT touch project.yml.
    # Every bump PR therefore re-creates a floor drift until project.yml's
    # `from:` is aligned by hand; ReleaseReadinessTests.
    # testSparkleFloor_projectYmlMatchesPbxproj fails CI until it is.
    # (PR #99 disproved the earlier "this entry is a placeholder that
    # surfaces no PRs" claim.)
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "deps"
    open-pull-requests-limit: 5