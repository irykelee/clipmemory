name: TSan (advisory)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每日 UTC 04:00 (= 北京时间 12:00) — 避开 CI 高峰
    - cron: '0 4 * * *'
  workflow_dispatch:

# ID-CI-0023 (2026-10-26): concurrency group — see the measurement in
# .github/workflows/ci.yml for the same ID. TSan shares the macOS-hosted
# runner fleet with CI, so without a group every push to main stacks
# another 4.5-8.8 min advisory run behind the previous one and steals
# the very slots the required `build-and-test` check is waiting for.
# `github.event_name` is part of the group so the daily 04:00 UTC
# scheduled run gets its own group and is never cancelled by a push
# (schedule events carry the default-branch ref, same as main pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # github-script PR comment 需要

jobs:
  tsan-pr-subset:
    # ID-CI-0009 (2026-09-26): PR subset assertion drift guard.
    # PR 触发: 跑最可能暴露 race 的 subset. The "-ne" assertion below
    # calibrates the expected count to the live `-only-testing` filter
    # list (see SUBSET_EXPECTED in the assertion step — 97 as of
    # 2026-10-28, confirmed by Scripts/lint-tsan-filter.sh).
    # ⚠️ ID-REVIEW-1046 (2026-10-28): 95 → 97. The `SafeModeServiceTests`
    # class gained 2 tests (the "写哨兵失败时不得计数" and the
    # "计数必须是有条件清零" regressions) and it IS one of the 9 subset
    # classes ⇒ the expected count had to move with it.
    # ⇒ **This is the "看 33 个" rule applied to CI**: adding a test to ANY
    # subset class breaks this guard, and the guard is what tells you.
    # Update that env var when intentionally adding/removing a
    # race-prone test class. ID-CI-0009 added SUBSET_PASSED export so
    # the PR comment can distinguish "subset broken" from "subset
    # clean + 0 races" — previously the comment always printed "✅
    # Races: 0 detected" regardless of the assertion result, masking
    # real drift (e.g. the cdda2a6→a4f87e2 window where
    # NetworkMonitor class rename silently disabled the filter).
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    # ID-CI-0022 (2026-10-15, P1): job-level `continue-on-error: true` was
    # REMOVED here. Per GitHub workflow-syntax docs, it "prevents a workflow
    # run from failing when a job fails" — so the `exit 1` in the race-gate
    # and subset-assertion steps below were neutralised at run level: a job
    # full of races rendered green. `::error::` annotations do not feed a
    # branch-protection check conclusion either.
    #
    # This exact defect was flagged as P1 by the repo's own auto-review twice
    # (auto-review-20260928-100714-98075.md, auto-review-agent-20260929-111152-89425.md)
    # and survived both times because the gate was bolted onto tsan-full
    # WITHOUT removing the line that swallowed it. This job — the only one
    # that runs on pull_request — had no race gate at all. Whether it also
    # blocks merging depends on branch-protection config, which is not
    # stored in this repo; verify there before relying on it as a gate.
    #
    # Known test-level TSan failures stay non-blocking via STEP-level
    # `continue-on-error: true` on the build+test step below, so unrelated
    # runner flakes (see docs/skips-ledger.md) do not mask the race verdict.
    env:
      # ID-CI-0009 (2026-09-26): single source of truth for the subset
      # expected count. Both the assertion step (bash) and the PR
      # comment step (JS via process.env) read this. Update when the
      # `-only-testing` class list changes — see comment above.
      SUBSET_EXPECTED: '97'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if which xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build + Test (TSan, PR subset)
        # ID-CI-0022 (2026-10-15): step-level (not job-level)
        # continue-on-error. Keeps unresolved runner-specific test failures
        # from blocking the PR, while the race gate below stays authoritative.
        # `if: always()` on the gate guarantees it still runs afterwards.
        continue-on-error: true
        env:
          TSAN_OPTIONS: "ignore_noninstrumented_modules=1:second_deadlock_stack=1"
        run: |
          set -euo pipefail
          xcodebuild -scheme ClipMemory -configuration Debug \
            test CODE_SIGN_IDENTITY="-" \
            -enableThreadSanitizer YES \
            ENABLE_THREAD_SANITIZER=YES \
            -only-testing:ClipMemoryTests/ClipboardMonitorTests \
            -only-testing:ClipMemoryTests/ClipboardMonitorSkipWindowTests \
            -only-testing:ClipMemoryTests/NetworkMonitorProtocolTests \
            -only-testing:ClipMemoryTests/UpdateServiceTests \
            -only-testing:ClipMemoryTests/FeedProbeFallbackChainTests \
            -only-testing:ClipMemoryTests/FeedProbeSizeCapTests \
            -only-testing:ClipMemoryTests/ClipboardStoreCryptoKeyThreadTests \
            -only-testing:ClipMemoryTests/SafeModeServiceTests \
            -only-testing:ClipMemoryTests/CrashReportServiceTests \
            2>&1 | tee /tmp/tsan.log

      # ID-CI-0022 (2026-10-15, P1): race gate for the PR path. This step did
      # not exist before — commit 0436943 added the gate to tsan-full ONLY,
      # leaving tsan-pr-subset (the only job that runs on pull_request) with
      # no race verdict at all. Mirrors the identically-named
      # "TSan race count gate (fail-closed)" step in the tsan-full job.
      # (Referenced by name, not line number — line refs in this file drift
      # every time a comment is added.)
      - name: TSan race count gate (fail-closed)
        if: always()
        run: |
          if [ ! -f /tmp/tsan.log ]; then
            echo "::error::TSan log missing — cannot judge races (treating as INSTRUMENTED=NO)"
            echo "INSTRUMENTED=NO" >> "$GITHUB_ENV"
            exit 1
          fi
          # ID-CI-0022 hardening: a COMPILE failure also produces no
          # `Executed N test` line, so `grep -c` would return 0 and this
          # gate would report "0 races" — the same false-green class the
          # job-level continue-on-error used to cause. The build+test step
          # carries `continue-on-error: true`, so a broken build reaches this
          # gate instead of aborting the job. Require positive evidence that
          # tests actually ran before trusting a zero count.
          if ! grep -qE "Executed [0-9]+ test" /tmp/tsan.log; then
            echo "::error::No 'Executed N test' in TSan log — build or test startup failed; race count is unknowable, NOT zero"
            exit 1
          fi
          # Match the PR-comment counter's pattern exactly
          # (see the github-script step below). A bare
          # "WARNING: ThreadSanitizer" also matches SEGV / other warnings,
          # which made the gate report "1 data race" while the comment
          # reported "0 races" for the same run.
          races=$(grep -c "WARNING: ThreadSanitizer: data race" /tmp/tsan.log || true)
          if [ "${races:-0}" -eq 0 ]; then
            echo "✅ TSan: 0 data races detected"
          else
            echo "::error::$races data race(s) detected by TSan"
            echo "--- race sites (first 20) ---"
            grep -n "WARNING: ThreadSanitizer: data race" /tmp/tsan.log | head -20
            exit 1
          fi

      - name: Build instrumentation canary (compiled evidence)
        if: always()
        run: |
          if grep -qE "sanitize=thread|libclang_rt\.tsan" /tmp/tsan.log; then
            echo "INSTRUMENTED=YES" >> "$GITHUB_ENV"
            echo "✅ Build canary passed: TSan instrumentation evidence in log"
          else
            echo "INSTRUMENTED=NO" >> "$GITHUB_ENV"
            echo "❌ Build canary failed: no TSan instrumentation evidence — NOT testing anything"
            exit 1
          fi

      - name: Subset executed assertion (PR job only, 防 -only-testing 静默跑 0)
        if: always() && github.event_name == 'pull_request'
        run: |
          executed=$(grep -oE 'Executed [0-9]+ test' /tmp/tsan.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "SUBSET_EXECUTED=${executed:-未解析}" >> "$GITHUB_ENV"
          if [[ -z "$executed" || "$executed" != "$SUBSET_EXPECTED" ]]; then
            echo "SUBSET_PASSED=false" >> "$GITHUB_ENV"
            echo "❌ Subset assertion failed: expected ${SUBSET_EXPECTED}, got ${executed:-未解析} (可能 -only-testing 类名漂移)"
            exit 1
          fi
          echo "SUBSET_PASSED=true" >> "$GITHUB_ENV"
          echo "✅ Subset assertion passed: ${SUBSET_EXPECTED}/${SUBSET_EXPECTED} tests executed"

      - name: Upload TSan log (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tsan-log-${{ github.run_id }}
          path: /tmp/tsan.log

      - name: Comment race count + instrumentation status on PR
        if: always() && github.event.pull_request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const logPath = '/tmp/tsan.log';
            const logExists = fs.existsSync(logPath);
            const log = logExists ? fs.readFileSync(logPath, 'utf8') : '';
            const raceCount = log ? (log.match(/WARNING: ThreadSanitizer: data race/g) || []).length : 0;
            const instrumented = process.env.INSTRUMENTED === 'YES';
            const subsetPassed = process.env.SUBSET_PASSED === 'true';
            const subsetExecuted = process.env.SUBSET_EXECUTED ?? '未解析';
            let body;
            if (!logExists) {
              body = '⚠️ **TSan 日志缺失**: 前置步骤 (checkout / xcodegen / build) 失败, 本次无结果。检查 workflow logs。';
            } else {
              const instLine = instrumented
                ? '🔧 **Instrumentation**: verified (`sanitize=thread` in build log)'
                : '⚠️ **Instrumentation**: NOT verified — 本次结果无意义, 请检查 workflow';
              // ID-CI-0009: subsetLine reads SUBSET_EXECUTED, NOT raceCount
              // (which counts race warnings). The previous version used
              // raceCount as a proxy for executed-test-count and produced
              // nonsense like "expected 94, actual 3" when 0 races + 40
              // tests. SUBSET_EXECUTED is the actual count from the
              // assertion step's grep.
              const subsetLine = subsetPassed
                ? `✅ **Subset count**: ${subsetExecuted}/${subsetExecuted} executed (drift guard passed — filter + count aligned)`
                : `❌ **Subset count**: expected ${process.env.SUBSET_EXPECTED ?? '?'}, actual ${subsetExecuted}. \`Executed N tests\` 与 -only-testing 类列表漂移（filter 引用了不存的 class, 或新增/删除了 race-prone test class）。下面 race 数字基于 stale 测试集, 请检查 workflow log + 该 PR 是否改了测试类名`;
              const raceLine = raceCount > 0
                ? `🔬 **Races**: ${raceCount} detected. Download \`tsan-log-${context.runId}\` artifact for full trace.`
                : `✅ **Races**: 0 detected (over ${subsetExecuted} executed tests).`;
              body = [instLine, subsetLine, raceLine].join('\n');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  tsan-full:
    # nightly + workflow_dispatch: 跑全套 tests (count from
    # Scripts/test-count.sh, ID-TEST-0002 forbids hard-coding), 60min timeout
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 60
    # ID-CI-0022 (2026-10-15, P1): job-level `continue-on-error: true`
    # REMOVED. It neutralised the race gate's `exit 1` at run level, so a
    # nightly run full of data races stayed green. Moved to STEP level on
    # the build+test step below: unresolved runner-only test failures
    # (docs/skips-ledger.md) stay non-blocking, the race verdict does not.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if which xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build + Test (TSan, full suite)
        # ID-CI-0022 (2026-10-15): step-level (not job-level)
        # continue-on-error — see the job header above.
        continue-on-error: true
        env:
          TSAN_OPTIONS: "ignore_noninstrumented_modules=1:second_deadlock_stack=1"
        run: |
          set -euo pipefail
          xcodebuild -scheme ClipMemory -configuration Debug \
            test CODE_SIGN_IDENTITY="-" \
            -enableThreadSanitizer YES \
            ENABLE_THREAD_SANITIZER=YES \
            2>&1 | tee /tmp/tsan.log

      # ID-CRASH-0009 (2026-09-28 code-review P1-4): race-detection gate.
      #
      # ⚠️ CORRECTION (ID-CI-0022, 2026-10-15): the original comment here
      # claimed this step "turns the suite into a real CI gate". That was
      # FALSE for 17 days. The step existed, but its `exit 1` was swallowed
      # by job-level `continue-on-error: true` on this job — GitHub's
      # workflow-syntax docs: it "prevents a workflow run from failing when a
      # job fails". `::error::` annotations do not feed branch protection
      # either, so a run full of races stayed green. The repo's own
      # auto-review flagged this as P1 twice
      # (auto-review-20260928-100714-98075.md,
      #  auto-review-agent-20260929-111152-89425.md) without the root cause
      # being fixed. ID-CI-0022 removed the job-level flag (moved to
      # step-level on the build+test step) — THAT is what made this gate
      # authoritative, not the step's existence.
      # Mirrors the "Build instrumentation canary" gate below (also grep + exit 1).
      - name: TSan race count gate (fail-closed)
        if: always()
        run: |
          # Without this guard a missing log yields `grep -c` = 0 and the
          # gate silently PASSES — the same false-green class as above.
          if [ ! -f /tmp/tsan.log ]; then
            echo "::error::TSan log missing — cannot judge races (treating as INSTRUMENTED=NO)"
            echo "INSTRUMENTED=NO" >> "$GITHUB_ENV"
            exit 1
          fi
          # ID-CI-0022 hardening: a compile failure produces no
          # `Executed N test` line either, and this job has no
          # subset-count assertion to back it up — so without this the
          # gate would happily print "0 data races" for a build that
          # never ran. Require positive evidence that tests ran.
          if ! grep -qE "Executed [0-9]+ test" /tmp/tsan.log; then
            echo "::error::No 'Executed N test' in TSan log — build or test startup failed; race count is unknowable, NOT zero"
            exit 1
          fi
          # Pattern kept identical to the PR-comment counter in the
          # tsan-pr-subset job so both report the same number.
          races=$(grep -c "WARNING: ThreadSanitizer: data race" /tmp/tsan.log || true)
          if [ "${races:-0}" -eq 0 ]; then
            echo "✅ TSan: 0 races detected"
          else
            echo "::error::$races data race(s) detected by TSan"
            echo "--- race sites (first 20) ---"
            grep -n "WARNING: ThreadSanitizer" /tmp/tsan.log | head -20
            exit 1
          fi

      - name: Build instrumentation canary (compiled evidence)
        if: always()
        run: |
          if grep -qE "sanitize=thread|libclang_rt\.tsan" /tmp/tsan.log; then
            echo "INSTRUMENTED=YES" >> "$GITHUB_ENV"
            echo "✅ Build canary passed: TSan instrumentation evidence in log"
          else
            echo "INSTRUMENTED=NO" >> "$GITHUB_ENV"
            echo "❌ Build canary failed: no TSan instrumentation evidence — NOT testing anything"
            exit 1
          fi

      - name: Upload TSan log (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: tsan-log-${{ github.run_id }}
          path: /tmp/tsan.log
