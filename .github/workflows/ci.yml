name: CI

on:
  push:
    branches: [main]
    # ID-CRASH-0019 (2026-09-28 code-review P2-16): tag trigger so
    # `git push vX.Y.Z` also runs the 5 custom lint gates. The
    # release path is the only moment those gates matter; today
    # it's exactly when they're skipped. release.yml has zero
    # lint steps, so without this trigger the lint-side defense
    # is inert on release commits. `'v*'` matches the project's
    # semver-style tag convention (verified: tags are vX.Y.Z where
    # X is the major).
    tags: ['v*']
  pull_request:
    branches: [main]

# ID-CI-0023 (2026-10-26): concurrency group. Every push to main fans out
# into SEVERAL macOS-hosted workflows (CI here, TSan advisory, Release PR
# dry-runs from dependabot, Sync Gitee mirror), and GitHub-hosted macOS
# runner concurrency is limited — so N commits pushed in a row stack N CI
# runs and the branch-protection gate (`build-and-test`, the only required
# check) on HEAD ends up behind the whole queue.
# Measured 2026-10-26 (the ID-REVIEW-1034 fix push, 4 commits in ~7 min):
# CI queue depth 4 AND TSan queue depth 4. Only 2 CI `build-and-test` jobs
# ever ran concurrently while the 3rd and 4th waited >10 min for a slot,
# and the required check on HEAD was still `queued` long after the fix was
# already verified locally (1257 tests / 0 failures / 0 host restarts).
# `cancel-in-progress: true`: a newer commit supersedes an older one —
# only HEAD's check gates the branch (branch protection requires
# `build-and-test` on HEAD). Older runs are pure queue ballast.
# Group is per-ref so a `v*` tag run lands in its own group and never
# cancels an in-flight main run — the release path keeps its own CI.
# This also brings ci.yml in line with release.yml / sync-gitee.yml, which
# already declare groups (repo convention; ci.yml was the outlier).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    # 2026-07-24: a modal NSAlert on the test host once hung this job for
    # 60+ min with zero output (healthy baseline is 2-3 min). Hard-cap so
    # any future hang fails fast instead of silently burning runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        # ⇒ ⇒ **全历史**（第十三轮加）⇒ ⇒ 探针清单的**基线一侧**需要取基线
        # ⇒ ⇒ commit（`473fade`）的守卫源码 ⇒ ⇒ shallow clone 拿不到 ⇒ ⇒
        # ⇒ ⇒ ⇒ 而「旧版逃逸 N 条」这个数字**必须**在 CI 里被核对 ⇒ ⇒ ⇒
        # ⇒ ⇒ ⇒ 否则它就只是台账里的一个手写数字 ⇒ ⇒ ⇒ ⇒ （仓库只有 23M ⇒ ⇒ 代价可忽略）
        with:
          fetch-depth: 0

      # REL-23 (2026-08-03): README hygiene gate — DOC-0002/DOC-0003 prevention.
      # Ported from ~/Projects/ClipMemory-local/release.sh preflight (9eebd8d,
      # local-only repo, not on GitHub). The global core.hooksPath
      # (~/bin/git-hooks) bypasses this repo's .git/hooks/pre-commit xcodebuild
      # gate, so CI is the only automated pre-merge gate; running these checks
      # first fails fast on README pollution without burning a full build.
      # Deliberately in ci.yml, NOT release.yml: release.yml only fires on tag
      # push / its own changes, so a plain README PR would never reach it.
      # Canary anti-silence (REL-M13) intentionally stays in local release.sh —
      # it needs the xcodebuild test log and is lower priority than README
      # hygiene.
      - name: Check README hygiene (DOC-0002/0003)
        run: |
          set -euo pipefail
          FAILS=0
          fail() { echo "❌ $*"; FAILS=$((FAILS+1)); }

          # DOC-0002: no duplicate '### vX.Y.Z (' heading in any of the 7
          # READMEs for the current dev version (sync_readme.py
          # strip_extra_headings() regression guard).
          VERSION=$(grep -E '^    MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          for f in README.md docs/lang/README_EN.md docs/lang/README_ZH-HANT.md docs/lang/README_JA.md docs/lang/README_KO.md docs/lang/README_ES.md docs/lang/README_PT.md; do
            # NEW-7 (2026-08-03 audit, ID-MISC-0008): `grep -c` on a
            # zero-match input returns exit 1 AND prints "0", so the old
            # `|| echo 0` appended a second "0" producing COUNT="0\n0".
            # The subsequent `[[ -gt 1 ]]` arithmetic then errored but
            # because the error happened inside the `if` condition (not
            # a top-level command), `set -e` did NOT propagate and the
            # gate silently passed — including the case where the
            # version section is entirely missing from a README (the
            # opposite of what DOC-0002 is meant to catch).
            # `|| true` swallows the exit code; `${COUNT:-0}` collapses
            # a missing var to 0; the `-ne 1` predicate now rejects both
            # duplicates (>1) AND absence (<1).
            COUNT=$(grep -c "^### v${VERSION} (" "$f" 2>/dev/null || true)
            COUNT=${COUNT:-0}
            if [[ "$COUNT" -ne 1 ]]; then
              fail "${f} has ${COUNT} '### v${VERSION} (' headings (expected exactly 1, DOC-0002)"
            fi
          done
          echo "✅ exactly one v${VERSION} README heading per locale"

          # ID-L10N-0024 (2026-08-03 audit, NEW-4): enforce that every
          # locale's v${VERSION} section has the same `###` heading
          # count as the zh-Hans canonical (README.md). Sync script's
          # strip_extra_headings() guards against future LLM-injected
          # decorative sub-headings; this gate guards against any future
          # sync path that bypasses the script (e.g. hand-edits, plugin
          # injections) and against drift between sync runs.
          CANONICAL_COUNT=$(awk '/^### v'"${VERSION}"' /{flag=1; next} /^### v[0-9]+\.[0-9]+\.[0-9]+/{flag=0} flag && /^### /' README.md | wc -l | tr -d ' ')
          for f in docs/lang/README_EN.md docs/lang/README_ZH-HANT.md docs/lang/README_JA.md docs/lang/README_KO.md docs/lang/README_ES.md docs/lang/README_PT.md; do
            LOC_COUNT=$(awk '/^### v'"${VERSION}"' /{flag=1; next} /^### v[0-9]+\.[0-9]+\.[0-9]+/{flag=0} flag && /^### /' "$f" | wc -l | tr -d ' ')
            if [[ "$LOC_COUNT" != "$CANONICAL_COUNT" ]]; then
              fail "${f} v${VERSION} section has ${LOC_COUNT} '###' sub-headings (canonical README.md has ${CANONICAL_COUNT}, ID-L10N-0024)"
            fi
          done
          echo "✅ v${VERSION} section heading structure consistent across all 7 locales"

          # DOC-0003: cross-locale Trash terminology pollution. Each
          # language's README must contain only its own Trash term —
          # never any other language's. Mirror of sync_readme.py:50
          # GLOSSARY["回收站"] (the canonical map). Covers all 7 langs
          # (REL-24 2026-08-03 audit F-4 — previous gate was 3 files only).
          declare -A EXPECTED_TRASH=(
            ["README.md"]="回收站"
            ["docs/lang/README_ZH-HANT.md"]="垃圾桶"
            ["docs/lang/README_EN.md"]="Trash"
            ["docs/lang/README_JA.md"]="ごみ箱"
            ["docs/lang/README_KO.md"]="휴지통"
            ["docs/lang/README_ES.md"]="Papelera"
            ["docs/lang/README_PT.md"]="Lixeira"
          )
          # All Trash terms across locales. CJK terms use -F (fixed string);
          # Western terms use ERE (^|[^A-Za-z0-9_.])Term([^A-Za-z0-9_.]|$)
          # — proxy for lookbehind/lookahead that avoids matching inside
          # identifiers like TrashStore or i18n key paths like trash.json
          # (without needing GNU grep's -P, which stock macOS grep lacks).
          ALL_TRASH_CJK=("回收站" "垃圾桶" "ごみ箱" "휴지통")
          ALL_TRASH_WESTERN=("Trash" "Papelera" "Lixeira")
          for file in "${!EXPECTED_TRASH[@]}"; do
            expected="${EXPECTED_TRASH[$file]}"
            for term in "${ALL_TRASH_CJK[@]}"; do
              if [[ "$term" != "$expected" ]] && grep -qF "$term" "$file" 2>/dev/null; then
                fail "$file contains foreign Trash term '$term' (expected '$expected' for this locale)"
              fi
            done
            for term in "${ALL_TRASH_WESTERN[@]}"; do
              if [[ "$term" != "$expected" ]]; then
                PATTERN="(^|[^A-Za-z0-9_.])${term}([^A-Za-z0-9_.]|$)"
                if grep -qiE "$PATTERN" "$file" 2>/dev/null; then
                  fail "$file contains foreign Trash term '$term' as standalone word (expected '$expected')"
                fi
              fi
            done
          done
          # Legacy "Recycle Bin" annotation (DOC-0003 root-cause fix) must not
          # appear in any README regardless of locale.
          for file in "${!EXPECTED_TRASH[@]}"; do
            if grep -qiF "Recycle Bin" "$file" 2>/dev/null; then
              fail "$file contains legacy 'Recycle Bin' annotation (should use local Trash term)"
            fi
          done
          echo "✅ Trash glossary consistent across all 7 locales (zh-Hans/zh-Hant/en/ja/ko/es/pt)"

          if [[ "$FAILS" -gt 0 ]]; then
            echo "❌ README hygiene checks FAILED."
            exit 1
          fi
          echo "✅ All README hygiene checks passed."

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        # REL-11 (2026-07-24 review): skip brew install when the binary is
        # already on PATH (same guard as release.yml's Install XcodeGen step).
        run: |
          if which xcodegen >/dev/null 2>&1; then
            echo "xcodegen already installed: $(xcodegen --version)"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Assert committed pbxproj is xcodegen-in-sync
        # 2026-10-01 (pre-push review round 3, finding: dependabot bump
        # PR #99 edited only the pbxproj/Package.resolved, leaving
        # project.yml's Sparkle floor stale — and this job's own
        # `xcodegen generate` silently regenerated over the bump, so a
        # green run proved nothing about the committed pbxproj). A diff
        # here fails the job whenever the committed pbxproj does not
        # match project.yml — closing the same class release.sh's
        # check_xcodegen_sync guards locally. The Sparkle-specific pair
        # is additionally asserted by
        # ReleaseReadinessTests.testSparkleFloor_projectYmlMatchesPbxproj.
        run: |
          git diff --exit-code ClipMemory.xcodeproj/project.pbxproj \
            || { echo "::error::project.pbxproj is stale — run 'xcodegen generate' after editing project.yml and commit the result."; exit 1; }

      - name: Build
        # CI builds stay ad-hoc (CODE_SIGN_IDENTITY="-"): the self-signed
        # release identity lives in repo secrets, which fork PRs cannot
        # access — and tests never touch the production Keychain anyway.
        run: xcodebuild -scheme ClipMemory -configuration Debug build CODE_SIGN_IDENTITY="-"

      - name: Test
        # NEW-1 盲区 6 (2026-08-06 review): the ZZZ canary can only fail
        # if it actually runs. If xcodebuild aborts mid-run (segfault,
        # OOM, infrastructure hang), the test process exits before ZZZ
        # fires and CI reports "TEST SUCCEEDED" with `Executed 0 tests`.
        # Asserting a minimum test count catches this: a real run reports
        # `Executed N tests` (N ≈ Scripts/test-count.sh static estimate;
        # ID-TEST-0002 forbids hard-coding the value here). The 920
        # threshold is a lower bound — a partial-suite abort that
        # loses more than this many tests fails the gate.
        #
        # P2-17 (2026-09-22 audit): enable code coverage + emit
        # xcresult bundle so the downstream coverage-gate job can
        # enforce the line-coverage minimum. Coverage instrumentation
        # is enabled on this first run only (the zh-Hans locale run
        # below stays as-is to keep CI time flat — coverage data
        # is identical between locales since the test suite does
        # not vary, only L10n string resolution).
        run: |
          set -euo pipefail
          # P2-17 fix (2026-09-22 OpenCode review): wrap the xcresult bundle
          # in a parent directory so upload-artifact@v4 preserves the
          # *.xcresult/ directory structure on the consumer side.
          # upload-artifact@v4 strips its rootDirectory from the archive
          # paths (see @actions/toolkit upload-zip-specification.ts:
          # `file.replace(rootDirectory, '')`); without a parent wrapper
          # the bundle contents flatten to the archive root and the
          # downstream `find -name '*.xcresult' -type d` returns empty.
          mkdir -p "$GITHUB_WORKSPACE/results"
          rm -rf "$GITHUB_WORKSPACE/results/clipmemory-test.xcresult"
          xcodebuild -scheme ClipMemory -configuration Debug \
            -enableCodeCoverage YES \
            -destination 'platform=macOS' \
            -resultBundlePath "$GITHUB_WORKSPACE/results/clipmemory-test.xcresult" \
            test CODE_SIGN_IDENTITY="-" 2>&1 | tee /tmp/xcb-test.log
          executed=$(grep -oE 'Executed [0-9]+ test' /tmp/xcb-test.log | tail -1 | grep -oE '[0-9]+')
          echo "Test execution count: $executed"
          # ID-CRASH-0014 (2026-09-28 code-review P2-3): replace hard-coded
          # 920 lower bound with the static estimate from
          # Scripts/test-count.sh minus a small slack. CLAUDE.md
          # ID-TEST-0002 forbids hard-coding the value here — the
          # previous 920 drifted whenever new tests were added (the
          # actual count today is 1011). The 10-test slack is the
          # difference between the static `grep -c func test*`
          # estimate and the dynamic `Executed N test` runtime count,
          # which differ by parameterized / Objective-C selector
          # tests that the static count misses.
          expected=$(Scripts/test-count.sh)
          echo "Expected test count (from Scripts/test-count.sh): $expected"
          if [[ -z "$executed" || "$executed" -lt $((expected - 10)) ]]; then
            echo "❌ Blind spot 6: test count $executed is below the $((expected - 10)) lower bound — ZZZ canary may not have run. Investigate the log for early-terminated suites."
            exit 1
          fi

      # ID-REVIEW-1049 第六轮 (2026-11-01): shell 脚本的**可移植性**静态守卫。
      #
      # ⇒ CI 第一次把第六轮跑红，报的是
      #   `test_verify_production_canaries.sh: line 352: MODE?: unbound variable`
      #   ⇒ 根因：`echo "…（mode=$MODE）"` —— **全角括号紧跟未加花括号的
      #   `$MODE`** ⇒ 在 **bash 3.2 + UTF-8 locale**（= 本 CI runner）下，
      #   bash 把多字节字符**吸进变量名** ⇒ `set -u` ⇒ unbound variable。
      # ⇒ **本地测不出来**（本机 bash 5.3 判定不同 ⇒ 同一脚本本地 exit 0、
      #   CI exit 1）⇒ ⇒ 只有 CI 能引爆 ⇒ 这正是本族最危险的形状。
      # ⇒ 修法：`$VAR` 后紧跟多字节字符时**一律加花括号**（`${VAR}`）。
      # ⇒ 本 step 就是防止它**再回来**。
      - name: "Shell portability — multibyte $VAR boundary + bash 3.2 syntax (ID-REVIEW-1049)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_shell_multibyte_var_boundary.py .
          # ⇒ ⇒ ID-REVIEW-1049 第十一轮 (2026-11-02): the guard now FAILS
          #   when it scanned 0 files ("nothing found" is not "clean"), so its
          #   --self-test proves that path has teeth. V17 shape: a self-test
          #   that exists but is never invoked in CI is not a self-test.
          python3 Scripts/test/test_shell_multibyte_var_boundary.py . --self-test

      # ID-REVIEW-1049 第十轮 (2026-11-02): the heredoc quote-parity RULE
      # itself must not drift.
      #
      # ⇒ The step above scans the repo's shell scripts with `bash -n` (it asks
      #   the PARSER, so a wrong rule cannot blind it). But the rule we WRITE
      #   DOWN — "a heredoc that is LEXICALLY inside a `$( … )` must have an
      #   even number of each quote kind" — lives in several prose copies
      #   (guard docstring, contract script comment, ledger). Round 9 fixed ONE
      #   copy and left three stale ones ⇒ the same wrong rule was still on
      #   record.
      #
      # ⇒ ⇒ **"lexically" is load-bearing** (round 10 measured it): the trigger
      #   is the heredoc being LEXICALLY inside the `$( … )` TEXT — not "running
      #   inside `$( … )`". A heredoc in a function body, called from within
      #   `$( … )`, is lexically OUTSIDE ⇒ it is fine at any quote parity.
      #
      # ⇒ ⇒ This step checks the rule against reality: a machine-readable
      #   corpus (Scripts/test/shell-heredoc-quote-corpus.json, sha256-locked)
      #   holds the EXPECTED parse result for every shape × quote count, and
      #   the guard re-measures all of them with /bin/bash -n.
      #
      # ⇒ It is its OWN step (not a mode of the step above) so a failure is
      #   attributable — ID-REVIEW-1049 sixth round P3-6.
      # ⇒ ⇒ **第十一轮追加 `--self-test`**：自检能力写了却**从未被 CI 调用**
      #   ⇒ ⇒ 「有牙齿」的唯一自动证明**根本不在流水线里跑**
      #   ⇒ ⇒ 判据被改坏时 CI **不会发现** ⇒ ⇒ 同一个守卫同时是受害者和帮凶。
      #   ⇒ ⇒ 现在两个守卫的 `--self-test` **都**在 CI 里跑。
      - name: "Shell heredoc quote-parity rule vs reality (ID-REVIEW-1049 第十轮)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_shell_heredoc_quote_rule.py .
          python3 Scripts/test/test_shell_heredoc_quote_rule.py . --self-test

      # ID-REVIEW-1049 第十轮 (2026-11-02): the ledger's own section pointers.
      #
      # ⇒ "见 §50.22.4" is a POINTER, and a pointer is data: pointing at a
      #   section that does not exist breaks the chain of reasoning while
      #   looking perfectly normal. This is V14 ("the label must be sourced
      #   from the same thing it points at") applied to pointers.
      #
      # ⇒ The review gate raised exactly this twice on 2026-11-02 ("ensure the
      #   reference will not break when section numbers change"). Prose cannot
      #   stop that ⇒ it needs a mechanical check.
      #
      # ⇒ ⇒ **第十一轮追加 `--self-test`**：指针守卫**自带的**负对照矩阵
      #   （7 类坏指针必须报红 + 占位符/案例编号/尾随标点必须不误报）
      #   ⇒ ⇒ **在 CI 里自动复验** ⇒ ⇒ 判据哪天被改坏，CI 会立刻报红。
      # ⇒ Its own step (attributable failures — ID-REVIEW-1049 sixth round P3-6).
      - name: "Ledger section pointers resolve (ID-REVIEW-1049 第十轮)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_ledger_section_pointers.py .
          python3 Scripts/test/test_ledger_section_pointers.py . --self-test

      # ID-REVIEW-1049 第十四轮: workflow schema 的**静态守卫**。
      #
      # ⇒ ⇒ `fetch-depth: 0` 被写成 **step 级键**（应为 `with:` 的子键）⇒ ⇒
      #   ⇒ ⇒ GitHub 判定 workflow schema 非法 ⇒ ⇒ ⇒ ⇒ CI run `41587954678`
      #   ⇒ ⇒ ⇒ ⇒ **0 秒失败**（"This run likely failed because of a workflow
      #   ⇒ ⇒ ⇒ ⇒ file issue"）⇒ ⇒ ⇒ ⇒ 而 **YAML 能 parse** ⇒ ⇒ ⇒ ⇒
      #   ⇒ ⇒ ⇒ ⇒ 「能 parse」≠「schema 合法」⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      #   ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ Now the checker lives in the repo ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      #   ⇒ ⇒ ⇒ ⇒ (Scripts/test/test_workflow_schema.py) ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      #   ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ It is **text-level** on purpose ⇒ ⇒ a YAML parser would happily
      #   ⇒ ⇒ accept an illegal schema ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      #   ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      - name: "Workflow schema guard (ID-REVIEW-1049 第十四轮)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_workflow_schema.py
          python3 Scripts/test/test_workflow_schema.py --self-test

      # ID-REVIEW-1049 第十四轮 e: adjudication 台账的**失效锚点**逐条重验。
      #
      # ⇒ ⇒ 第十三轮记下「存量结论因文件改动而**自动失效** ⇒ 留作下一轮的活」
      # ⇒ ⇒ 第十四轮实测 **124** 条失效（P0 12 / P1 40）⇒ ⇒ 而「重新核验」
      # ⇒ ⇒ **没有工具** ⇒ ⇒ 人肉做 124 遍既慢又不可复算 ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ 本文件把那 124 条结论**拆成机器可查的判据**（129 静态 + 2 实跑）
      # ⇒ ⇒ 并带一张**覆盖表**（证明**一条不漏**）⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⛔ **不允许「批量刷 sha」** —— 第十四轮 b 自己踩过：把**没核验过**
      # ⇒ ⇒ 的结论刷成当前 sha ⇒ ⇒ 等于**断言**「已核验过」⇒ ⇒ ⇒ ⇒ 说谎 ⇒ ⇒ ⇒ ⇒
      - name: "Adjudication stale-anchor re-verification (ID-REVIEW-1049 第十四轮 e)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_adjudication_claims.py
          python3 Scripts/test/test_adjudication_claims.py --self-test

      # ID-BETA-0001: beta 通道的**接线守卫**。
      #
      # ⇒ ⇒ beta 通道的安全性押在三根线上：app 端 delegate 真的转发到纯函数、
      # ⇒ ⇒ 纯函数默认半边是**空集**、发布侧条目带 channel 且**不动 tap**。
      # ⇒ ⇒ delegate 是 private ⇒ ⇒ **单元测试够不着** ⇒ ⇒ 这一层只能静态钉。
      # ID-BETA-0001 之十：**孤儿守卫清零**（macOS 专属那批）。
      #
      # ⇒ ⇒ 实测（2026-11-07）：这 6 个脚本**从来没在 CI 里跑过** ⇒ ⇒ 其中
      # ⇒ ⇒ `test_release.sh` 的一个 `set -e` 陷阱（赋值语句在**预期拒绝**时
      # ⇒ ⇒ 拿到非零退出码 ⇒ ⇒ `set -e` ⇒ ⇒ 整个脚本**当场死掉**）⇒ ⇒
      # ⇒ ⇒ **没有任何自动关卡能抓到** ⇒ ⇒ 而 commit message 里已经写了
      # ⇒ ⇒ ⇒ 「60/60 绿」—— 一个**没跑过**的数字（幸好数字碰巧对）。
      # ⇒ ⇒ ⇒ ⇒ 根因不是那条陷阱 ⇒ ⇒ 是「**守卫本身没人跑**」⇒ ⇒ 接进 CI。
      #
      # ⚠️ **为什么这个 step 放在 macOS job 而不是 ubuntu 的 lint-ids** ⇒ ⇒
      # ⇒ 这些脚本 source 的 `Scripts/package.sh` / `release.sh` / `rollback-release.sh`
      # ⇒ ⇒ 都用 **BSD sed 的 `sed -i ''`** ⇒ ⇒ GNU sed（Linux）会把 `''` 当脚本、
      # ⇒ ⇒ 把真表达式当**文件名** ⇒ ⇒ 报「can't read s|...|」⇒ ⇒
      # ⇒ ⇒ **第一次接进 CI 就被这条打出来**（linux 上红、macOS 上绿）⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ **接线**本身也有坑 ⇒ ⇒ ⇒ ⇒
      - name: "macOS-only shell test scripts (ID-BETA-0001 之十)"
        run: |
          set -euo pipefail
          # ⚠️ **逐个点名**（不是 glob 循环）⇒ ⇒ 孤儿守卫才能精确核对
          # ⇒ ⇒ ⇒ （glob 循环会让「守卫名单」变成一条**注释**也能满足的检查
          # ⇒ ⇒ ⇒ ⇒ —— 第十四轮 e 的演练实测抓到过这个洞）
          bash Scripts/test/test_package_cask_update.sh
          bash Scripts/test/test_regenerate_snapshots.sh
          bash Scripts/test/test_release.sh
          bash Scripts/test/test_remove_appcast_item.sh
          bash Scripts/test/test_rollback_release.sh
          bash Scripts/test/test_update_appcast.sh

      - name: "Beta channel wiring guard (ID-BETA-0001)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_beta_channel_wiring.py
          python3 Scripts/test/test_beta_channel_wiring.py --self-test

      # ID-REVIEW-1049 第十轮 c: the rule's PROSE COPIES must not drift.
      #
      # ⇒ ⇒ V15 ("a rule written in prose is itself a driftable copy") has now
      #   bitten TWICE: round 9 (one copy fixed, three stale ones left) and
      #   round 10 (the independent verifier found 4 copies missing the
      #   "lexically" qualifier — one of them written in THIS very round).
      #   ⇒ ⇒ Both times the failure mode was "forgot one", never "wrote one
      #   wrong" ⇒ ⇒ people cannot be relied on ⇒ ⇒ the drift must be checked
      #   by MACHINE.
      #
      # ⇒ ⇒ This guard checks every tracked prose file: a narrow phrasing must
      #   carry a "this is the old/ wrong form" marker, and a rule statement
      #   must carry BOTH the "lexically" qualifier AND a pointer to the
      #   machine-readable corpus (the prose copy's job is "say why + point at
      #   the truth", NOT "restate the truth").
      - name: "Rule prose copies don't drift (ID-REVIEW-1049 第十轮 c)"
        run: |
          set -euo pipefail
          python3 Scripts/test/test_rule_prose_copies.py .
          python3 Scripts/test/test_rule_prose_copies.py . --self-test

      # ID-REVIEW-1049 第十三轮: the prose guard's MUTATION SET, in-repo.
      #
      # ⇒ ⇒ 上一轮在台账里写「散文守卫 **19** 个变异体全部变红」⇒ ⇒ 而那套
      #   变异集**只存在于 /tmp** ⇒ ⇒ ⇒ ⇒ 第三方**无法复现** ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      #   ⇒ ⇒ ⇒ ⇒ CI 也不跑 ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ **那句话等于没说**
      #   ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ Now the set lives in the repo (Scripts/mutation/prose_guard_mutants.py)
      #   ⇒ ⇒ ⇒ ⇒ with an id-list sha256 lock ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ It also asserts THREE things the /tmp harness never did:
      #   ① the BASELINE must be green first (otherwise "all red" means nothing)
      #   ② the patch must ACTUALLY LAND (else "survived" may mean "never ran")
      #   ③ an anchor must match EXACTLY ONCE (0 or ≥2 ⇒ ⇒ red, never "skipped")
      - name: "Prose guard mutation set has teeth (ID-REVIEW-1049 第十三轮)"
        run: |
          set -euo pipefail
          python3 Scripts/mutation/prose_guard_mutants.py

      # ID-REVIEW-1049 第十三轮: the prose guard's PROBE CORPUS, in-repo.
      #
      # ⇒ ⇒ 台账里出现过「16/16 全部报红」「10 组全部 PASS」⇒ ⇒ 而那份探针
      # ⇒ ⇒ ⇒ 清单**只存在于 /tmp** ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ 第三方**无法复算** ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ Now the corpus lives in the repo (Scripts/test/prose-guard-probes.json)
      # ⇒ ⇒ ⇒ ⇒ ⇒ with every expectation MEASURED (not transcribed) ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ The BASELINE side runs the guard as of `473fade` ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      # ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒ ⇒
      - name: "Prose guard probe corpus (ID-REVIEW-1049 第十三轮)"
        run: |
          set -euo pipefail
          git show 473fade:Scripts/test/test_rule_prose_copies.py > "$RUNNER_TEMP/base_prose_guard.py"
          test -s "$RUNNER_TEMP/base_prose_guard.py"
          python3 Scripts/test/test_prose_guard_probes.py \
            --baseline-guard "$RUNNER_TEMP/base_prose_guard.py"

      # ID-REVIEW-1049 第十轮 c: the mutation harness's ANCHORS.
      #
      # ⇒ The harness locates what to mutate by matching an anchor TEXT.
      #   When the source moves, the anchor stops matching and the harness
      #   prints `ANCHOR MISSING … — skipped` ⇒ ⇒ that mutation is silently
      #   NOT tested any more.
      #
      # ⇒ ⇒ Measured (round c): that path was in NO verdict bucket
      #   (VERDICT only counted caught/survived/not_proven/mismatch/drift)
      #   ⇒ ⇒ anchor drift ⇒ `VERDICT caught=0 …` + **exit 0**
      #   ⇒ ⇒ "51 mutations, all caught" could become "49, all caught"
      #   with NOTHING reporting red ⇒ ⇒ the number in the ledger goes stale
      #   silently. ⇒ "skipped" was being recorded as "passed".
      #
      # ⇒ ⇒ This step is the CHEAP pre-flight: no build, no test run — it only
      #   proves every anchor is still present ⇒ ⇒ the ledger's "51" stays true.
      #   ⇒ ⇒ The harness itself now ALSO exits non-zero on ANCHOR_MISSING.
      - name: "Mutation harness anchors still resolve (ID-REVIEW-1049 第十轮 c)"
        run: |
          set -euo pipefail
          python3 Scripts/mutation/check_anchors.py

      - name: Assert the production canaries actually ran (ID-REVIEW-1049 第三轮)
        # The three production canaries are the ONLY thing that catches
        # "a test wrote the user's production domain". A **skipped** canary
        # is not a failure ⇒ the suite stays green with the safety net OFF.
        #
        # ⇒ This check lives OUTSIDE the test tree on purpose: the audit
        # inside the tree reads the tree's OWN arming signals ⇒ a
        # coordinated deletion of those signals cannot be caught from inside
        # ⇒ the arming must be asserted by a second, independent source
        # (this script reads the test log).
        #
        # ⇒ Measured 2026-11-01 (independent verifier P2-1): deleting the
        # baseline capture + both claims ⇒ 1436 tests / 7 skipped / 0
        # failures / TEST SUCCEEDED ⇒ the net was OFF and CI was green.
        run: |
          set -uo pipefail
          # ⚠️ Exit-code discipline (auto-review P0): 0 = armed, 1 = the check
          # RAN and the net is OFF, 2 = the check COULD NOT RUN (missing log
          # / usage error) ⇒ the two failures must not be conflated, or a
          # broken gate would be reported as "the safety net is off".
          code=0
          python3 Scripts/verify-production-canaries.py /tmp/xcb-test.log || code=$?
          # ⚠️ ID-REVIEW-1049 第四轮（独立核验员 P3-3）：这里原本只判「== 2」
          # ⇒ **其它**非 0 的退出码（例如 python 不在 PATH ⇒ 127）会一路
          # 掉到 `exit "$code"` ⇒ CI 虽然仍然红，但**没有任何「闸门坏了」的
          # 提示** ⇒ 排查方向会被带偏 ⇒ ⇒ 改成：**除 0/1 之外一律按「闸门
          # 自己坏了」报**（可区分性由文案承担）。
          if [[ "$code" != "0" && "$code" != "1" ]]; then
            echo "::error::canary 状态检查自己没跑起来（退出码 ${code}）—— 这是闸门坏了，不是安全网关着"
            exit 1
          fi
          exit "$code"

      # ID-REVIEW-1049 第四轮 (2026-11-01): the out-of-band gate's OWN contract.
      # The gate script is the only thing that catches "a test wrote the user's
      # production domain" — but it had NO guard of its own: deleting the
      # script + its two call sites (ci.yml / release.sh) left the suite
      # fully green (1436 / 4 skipped / 0 failures) with zero warnings
      # (independent verifier P1-1).
      #
      # ⇒ This test pins the gate's three-state exit-code contract
      # (0 armed / 1 net off / 2 gate broken) and its wiring. The mutation
      # it exists to catch: "make the script always exit 0" — the
      # "skipped log ⇒ must return 1" assertion turns red immediately.
      #
      # ⇒ Hermetic: it feeds the gate SYNTHETIC logs in a temp dir; it never
      # touches the user's preferences, keychain or clipboard.
      - name: Out-of-band canary gate contract test (ID-REVIEW-1049 第四轮)
        run: |
          set -euo pipefail
          bash Scripts/test/test_verify_production_canaries.sh --contract

      # ID-REVIEW-1049 第六轮 (2026-11-01): the lock MANIFEST's own integrity.
      #
      # ⇒ The manifest (`Scripts/canary-gate-locks.txt`) is the OUT-OF-BAND
      #   list of the locks. Round 5 moved it out of the tree — but the
      #   manifest itself had NO lock ⇒ emptying it (comments only) makes the
      #   contract script check **0 entries** ⇒ 0 problems ⇒ exit 0 ⇒ V8 was
      #   NOT closed (independent verifier P1-1, measured).
      #
      # ⇒ This step therefore asserts the manifest's own integrity:
      #   ① the entry COUNTS (file / guard) match the hard-coded ratchet,
      #   ② the effective lines' sha256 matches the hard-coded digest,
      #   ③ every listed guard still has at least the declared number of
      #      ASSERTIONS (a hollowed-out guard is caught, not just a deleted
      #      one — independent verifier P1-2).
      #
      # ⇒ It is a SEPARATE step on purpose: round 5's mechanism was parasitic
      #   inside round 4's step ⇒ a failure could not be attributed
      #   (independent verifier P3-5).
      - name: Canary-gate lock manifest integrity (ID-REVIEW-1049 第六轮)
        run: |
          set -euo pipefail
          bash Scripts/test/test_verify_production_canaries.sh --manifest

      - name: Collect test log for triage
        # ID-CRASH-0037 / issue #93 next step 2 ("Capture the failing
        # test's full xctest.log via GH artifact upload"): the v2.9.5 tag
        # run failed with no artifact to inspect, forcing manual log
        # archaeology through the Actions UI. Copy the test log into the
        # artifact directory on ANY outcome (the Test step only creates
        # results/ on the success path; recreate it here for failures).
        if: always()
        run: |
          mkdir -p results
          if [[ -f /tmp/xcb-test.log ]]; then
            cp /tmp/xcb-test.log results/xcb-test.log
          else
            echo "Test step did not run or log missing" > results/xcb-test.log.missing
          fi
          # zh-Hans locale run logs in too — it's a separate full-suite
          # xcodebuild invocation with its own failure surface.
          if [[ -f /tmp/xcb-test-zh.log ]]; then
            cp /tmp/xcb-test-zh.log results/xcb-test-zh.log
          fi

      - name: Upload xcresult bundle (P2-17)
        # Coverage-gate job consumes this artifact. Upload on ANY outcome:
        # on failure the xcresult still carries the per-test failure
        # detail (issue #93 triage), while coverage-gate itself only runs
        # when build-and-test succeeds (needs: dependency), so a failed
        # run's artifact is purely for post-mortem.
        #
        # P2-17 fix (2026-09-22 OpenCode review): `path: results` (parent
        # directory) so upload-artifact@v4's rootDirectory-strip leaves
        # clipmemory-test.xcresult/ as a sub-directory in the archive.
        # See Test step comment for the underlying mechanism.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: clipmemory-test-coverage
          path: results
          retention-days: 7
          if-no-files-found: error

      - name: Test (zh-Hans locale)
        # Same blind-spot-6 guard for the second locale run. Both
        # locales run the same tests (locale filter only
        # affects L10n string resolution, not test count).
        run: |
          set -euo pipefail
          xcodebuild -scheme ClipMemory -configuration Debug test -testLanguage zh-Hans CODE_SIGN_IDENTITY="-" 2>&1 | tee /tmp/xcb-test-zh.log
          executed=$(grep -oE 'Executed [0-9]+ test' /tmp/xcb-test-zh.log | tail -1 | grep -oE '[0-9]+')
          echo "zh-Hans test execution count: $executed"
          # ID-CRASH-0014 (2026-09-28 code-review P2-3): same lower-bound
          # pattern as the primary run — sourced from
          # Scripts/test-count.sh minus a 10-test slack. CLAUDE.md
          # ID-TEST-0002 forbids hard-coding the value here.
          expected=$(Scripts/test-count.sh)
          if [[ -z "$executed" || "$executed" -lt $((expected - 10)) ]]; then
            echo "❌ Blind spot 6 (zh-Hans): test count $executed is below the $((expected - 10)) lower bound"
            exit 1
          fi

      - name: Collect zh-Hans test log for triage
        # ID-REVIEW-1034 (2026-10-26): the "Collect test log for triage" step
        # above runs BEFORE this zh-Hans test step, so the zh-Hans run's log
        # was never uploaded — and that is exactly the log you need when the
        # zh-Hans step is the one that fails. In CI run 40186263416 the only
        # artifact was the PRIMARY run's log, and the failing step's own
        # output had to be pulled from the job log by hand.
        #
        # This step collects it AFTER the zh-Hans run and uploads it as its
        # own artifact, so the failing step's output is always recoverable.
        if: always()
        run: |
          mkdir -p results-zh
          if [[ -f /tmp/xcb-test-zh.log ]]; then
            cp /tmp/xcb-test-zh.log results-zh/xcb-test-zh.log
          else
            echo "zh-Hans test step did not run or log missing" > results-zh/xcb-test-zh.log.missing
          fi

      - name: Upload zh-Hans test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: clipmemory-zh-test-log
          path: results-zh
          retention-days: 7
          if-no-files-found: error

      - name: Upload snapshot mismatch artifacts (085151 P2)
        # SnapshotTestHelpers writes <test>.actual.png next to the golden
        # on byte mismatch — into the source tree (gitignored), never into
        # the xcresult, so the clipmemory-test-coverage artifact above does
        # not carry it. docs/skips-ledger.md's primary CI-diagnosis
        # prescription ("CI actual.png 产物核查") needs a producing
        # mechanism: upload the *.actual.png artifacts when a test step in
        # THIS job fails, so a CI-only mismatch's actual render is
        # inspectable post-mortem.
        #
        # auto-review-20261003-101344 P1: this step must live in THIS job —
        # its first landing (65c16e1) put it in lint-ids, which runs no
        # tests, cannot see this job's workspace, and passes when a
        # snapshot mismatch fails here (its if: failure() keyed off lint
        # failures), so the upload could never fire.
        #
        # Path is scoped to *.actual.png, not the whole __Snapshots__/
        # directory (101344 P2): after an unrelated failure a directory
        # glob would upload the 8 committed baselines under a name that
        # claims "mismatch" — the glob keeps "nothing to upload" honest
        # (if-no-files-found: ignore). upload-artifact@v4 strips its
        # rootDirectory (the least common ancestor of the matched files —
        # same mechanism as the Test step comment above), so the archive
        # holds flattened <test>.actual.png files.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: snapshot-mismatch-artifacts
          path: Tests/ClipMemoryTests/__Snapshots__/**/*.actual.png
          retention-days: 7
          if-no-files-found: ignore

  # L18 enforcement: audit finding references must use ID-DOMAIN-NNNN format.
  # Shipped alongside ID-PRIVACY-0001 / ID-STORE-0015 renumbering (2026-08-12 audit
  # retro correction, see feedback/audit-2026-08-12-id-renumbering.md). Catches
  # [HIGH-N] / M-N / L-N style refs in PR commit messages and added file lines.
  # Linux runner is sufficient — only needs bash + git.
  lint-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - name: L18 audit-ID format check
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-audit-ids.sh
          # --diff main  = check all changes introduced by this PR (commits + files)
          # Excludes main itself, so retro-edits to historical files don't false-positive.
          git fetch origin main
          ./Scripts/lint-audit-ids.sh --diff origin/main
      # ID-CI-0002 (2026-08-12): hotkey drift lint catches the canonical
      # modifier vs docs/UI drift that caused the 2026-07-16 S-3 →
      # 2026-07-21 BUG-011 → 2026-08-12 ID-DOCS-0001 cycle. See
      # feedback/2026-08-12-hotkey-drift-history.md.
      - name: Hotkey drift check (ID-CI-0002)
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-hotkey-drift.sh
          ./Scripts/lint-hotkey-drift.sh
      # ID-LINT-0001 (2026-08-13): every key referenced via
      # string("X") / plural("X") in LocalizationService.swift must
      # exist in all 7 *.lproj/Localizable.strings files. Catches
      # missing translations that would silently fall back to en in
      # non-en locales (the BUG-032 / alertUpdateFallback* pattern).
      - name: Translation parity check (ID-LINT-0001)
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-translations.sh
          ./Scripts/lint-translations.sh
      # ID-CI-0010 (2026-09-26): prevents the "class rename → stale
      # -only-testing filter" bug class. The cdda2a6 (PR #86) commit
      # renamed NetworkMonitorTests → NetworkMonitorProtocolTests;
      # tsan.yml kept the old name; 6 race-prone tests silently
      # stopped running under TSan until ID-CI-0007 fixed it manually
      # (a4f87e2, 2026-09-26). The script verifies each filter
      # reference points at a class that actually exists, and that the
      # static test count in those classes matches SUBSET_EXPECTED=95.
      # Catches the same failure mode automatically next time.
      - name: tsan filter lint (ID-CI-0010)
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-tsan-filter.sh
          ./Scripts/lint-tsan-filter.sh
      # ID-REL-2 (2026-10-05): extend the same class-existence /
      # count-drift check to release.yml's tag-path smoke subset.
      # The bug class was caught by auto-review-20261005-132311 P0
      # before any v2.9.6 tag push would have tripped the drift
      # guard (`ClipboardStoreCryptoKeyNotificationThreadTests` was
      # the file name; the class is `ClipboardStoreCryptoKeyThreadTests`
      # — `-only-testing` matches class names, not file names).
      # Parameterized the script to accept the workflow path; default
      # is still tsan.yml so the existing ID-CI-0010 invocation is
      # unchanged.
      - name: release filter lint (ID-REL-2)
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-tsan-filter.sh
          ./Scripts/lint-tsan-filter.sh .github/workflows/release.yml
      # ID-CI-0011 (2026-09-27): prevents the "release.yml Run tests
      # fail-open" bug class. The 149906d commit (ID-RELEASE-0003)
      # added `|| true` to the Run tests step as a one-release
      # workaround for an unverified v2.9.3 CI failure. Three problems
      # compounded: (a) the `|| true` was unconditional (no `if:`
      # guard, no expiry); (b) GH Actions macOS default shell has no
      # `pipefail`, so `xcodebuild test | tee log || true` is dead
      # code — tee's exit 0 does the swallowing, not `|| true`; (c)
      # release.sh:997 `gh run watch` guard silently stops catching
      # test regressions because the upstream test step stopped being
      # fail-closed. ID-CI-0005 (e897f30) had deliberately restored
      # fail-closed with a 33-line justification; 149906d undid it 19
      # hours later with a 3-line comment claiming "for this one
      # release" scope. da3cc6a reverted 149906d. This script
      # enforces that the next contributor cannot reintroduce the same
      # swallow — lines in the Run tests step that contain `xcodebuild
      # test` together with `| tee` or `|| true` (fail-open via tee's
      # exit-0 swallow), or `continue-on-error: true` inside the Run
      # tests step body, both fail CI before merge.
      #
      # ID-CI-0018 (2026-09-27): rule 3's step-body window is
      # anchored to 6-space indent (matching GH release.yml step
      # indent) and hard-FAILs if no `Run tests` step exists
      # (renaming the step would otherwise silently disarm rule 3).
      #
      # ID-CI-0019 (2026-09-27): rule 1 carve-out for the correct
      # remediation — `shell: bash` + `set -o pipefail` (or
      # `set -euo pipefail`) in the same step body. Partial
      # declarations still trip the rule (safe failure mode).
      # 8-fixture selftest (a/b/c fail-open caught, d/e clean,
      # f full carve-out, g/h partial).
      - name: release.yml fail-open policy check (ID-CI-0011 + ID-CI-0019)
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-release-yml.sh
          # ID-CI-0014 (2026-09-27): auto-review caught that the selftest
          # fixtures were unwired — the script's --selftest arg is what
          # proves rules 1/2/3 actually fire, and was missing from CI.
          # Without this, a future refactor that silently breaks the
          # awk / regex matchers leaves the job green. The selftest
          # runs first; if it fails the script exits before the real
          # release.yml check below.
          #
          # ID-CI-0019 (2026-09-27): the second invocation (real check
          # against .github/workflows/release.yml) verifies the
          # carve-out: a step declaring `shell: bash` AND containing
          # `set -o pipefail` (or `set -euo pipefail`) in the run
          # body is allowed to have `xcodebuild test | tee` (because
          # pipefail propagates the upstream exit code). Without
          # both declarations the swallow persists.
          ./Scripts/lint-release-yml.sh --selftest
          ./Scripts/lint-release-yml.sh

      # ID-CRASH-0013 (2026-09-28 code-review P2-14): appcast/tag
      # coverage drift gate. v2.9.3 shipped appcast.xml WITHOUT
      # pushing the tag because the Release workflow's
      # appcast-push substep was swallowed (auto-review 20260926 /
      # STATUS.md L77). Without this assertion the next release
      # could push appcast skipping some tag, and the drift would
      # accumulate silently (matches/cancels in naive diffs).
      # Two-way check: every git tag >= v2.5.0 (whitelisted)
      # appears as an <item> in appcast.xml; every appcast item
      # has a matching git tag. Mirrors the convention of
      # lint-translations / lint-release-yml / lint-tsan-filter.
      - name: appcast/tag coverage lint (ID-CRASH-0013)
        # 2026-10-01 (v2.9.5 tag run): skip on tag pushes. By construction
        # the tag's own appcast item cannot exist in the tag's tree:
        # release.yml commits the item to main AFTER the tag push (the
        # appcast-push substep), so this two-way check always fails for the
        # freshly pushed tag — both v2.9.5-rc2 and v2.9.5 tripped it as a
        # false positive. The v2.9.3 failure class ("appcast item without
        # tag") is still caught on main pushes and PRs, where the tag side
        # of the check sees the full tag list.
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          chmod +x Scripts/lint-appcast-coverage.sh
          ./Scripts/lint-appcast-coverage.sh

      # ID-REVIEW-1029 (2026-10-25): the review gate's OWN gate — the
      # adjudication layer that decides whether a model-reported P0/P1
      # blocks a push. It is the only thing standing between the 9B
      # model's unreliable severity labels and a blocked push, and it was
      # previously unguarded (Scripts/test/*.sh are not run by any other
      # CI job). The test covers all six decision directions plus the
      # wiring check (the gate must block on the EFFECTIVE verdict, not
      # on the model's raw conclusion line) — a regression there would
      # silently re-enable either "never blocks" or "always blocks".

      # ID-BETA-0001: 清理脚本（**会删文件**）的自测。
      #
      # ⇒ ⇒ 它默认是**干跑**，只有 `--apply` 才删 ⇒ ⇒ 自测要证明
      # ⇒ ⇒ 「默认不删 / --apply 才删 / 未知参数拒绝 / 日志写出」
      # ⇒ ⇒ 并且**全程用合成 seam** ⇒ ⇒ 绝不碰用户的 ~/Library/Preferences。
      - name: "Cleanup script self-test (ID-BETA-0001)"
        run: |
          set -euo pipefail
          bash Scripts/test/test_cleanup_test_plists_periodic.sh

      - name: Review gate adjudication test (ID-REVIEW-1029)
        run: |
          set -euo pipefail
          bash Scripts/test/test_review_adjudicate.sh

      # ID-REVIEW-1033 (2026-10-25): the review gate's LOCAL ollama path —
      # endpoint discovery (githooks/ollama-endpoints.sh). The gate used to
      # only ever talk to OLLAMA_HOST (default 11434). On this machine that
      # port is served by Ollama.app's 0.24.0, whose runner CANNOT run
      # gemma4's mlx architecture ("unsupported architecture"), while
      # Homebrew's 0.40.11 on 11435 runs everything. Hard-coding the
      # port made the chain head fail SILENTLY (no error, just no output),
      # so the whole gate degraded onto the external free tier — which dies
      # once the quota is gone. The discovery unit sorts local endpoints by
      # version descending (sort -r -V; plain -V is ASCENDING and would
      # have picked the broken one first) and the gate tries each until one
      # actually produces a report. (The two servers even SHARE one model store
      # (~/.ollama/models), so /api/tags returns the SAME list on both — the
      # manifest can never tell the endpoints apart; only a real call can.)
      # This test pins that ordering, the de-duplication, and the env-overrides
      # precedence.
      #
      # The test is hermetic: it stubs `curl` on PATH with a fixture table,
      # so it needs no ollama server on the runner (the CI runner has none).
      - name: Local ollama endpoint discovery test (ID-REVIEW-1033)
        run: |
          set -euo pipefail
          bash Scripts/test/test_ollama_endpoints.sh

  # P2-17 (2026-09-22 audit): minimum line coverage gate. Parses the
  # xcresult bundle emitted by build-and-test and fails the job if
  # coverage falls below COVERAGE_THRESHOLD (default 30% in script,
  # overridden to 2% in env below — see Run-coverage-gate step for
  # rationale).
  #
  # Independent of lint-ids so coverage regressions don't block
  # non-coverage fixes (lint-ids + coverage-gate run in parallel once
  # build-and-test finishes; neither blocks the other). Coverage-gate
  # only blocks its own required status check on this PR.
  #
  # macos-latest is required: xcrun xccov ships with Xcode toolchain.
  # The downloaded xcresult artifact preserves the directory tree, so
  # `find ./test-results -name '*.xcresult' -type d` locates it.
  coverage-gate:
    runs-on: macos-latest
    needs: build-and-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Download xcresult bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: clipmemory-test-coverage
          path: ./test-results
      - name: Run coverage gate (P2-17)
        env:
          # ID-CRASH-0015 (2026-09-28 code-review P2-13): raised
          # the coverage gate from the artificial 2% (just below the
          # 2026-09-22 baseline of 2.578%) to 50%. Measured at HEAD on
          # 2026-09-28 was 58.10% per the report, so 50% allows ~16%
          # relative regression before the gate fires. The
          # coverage-gate.sh script's default 30% is the aspirational
          # fallback for branches where this override is omitted.
          COVERAGE_THRESHOLD: '50'
        run: |
          set -uo pipefail
          chmod +x .github/scripts/coverage-gate.sh
          xcresult=$(find ./test-results -name '*.xcresult' -type d | head -1)
          if [ -z "$xcresult" ]; then
            echo "::error::No xcresult bundle found in downloaded artifact"
            exit 1
          fi
          echo "Analyzing: $xcresult"
          ./.github/scripts/coverage-gate.sh "$xcresult"

  # P2-18 (2026-09-22 audit): SwiftLint gate. Was previously only in
  # local Scripts/release.sh:733; the global core.hooksPath
  # (~/bin/git-hooks) can bypass repo-local pre-commit hooks, so CI is
  # the only authoritative auto gate for lint on every PR. GitHub
  # Actions macOS runners ship SwiftLint pre-installed (no install
  # step). Failure (errors) blocks merge; warnings surface as GitHub
  # annotations via --reporter github-actions-logging. macos-latest
  # required — SwiftLint needs the Swift toolchain that ubuntu-latest
  # does not ship.
  #
  # P2-18 fix (2026-09-22 OpenCode review): explicit `command -v
  # swiftlint` canary so a missing SwiftLint on the runner fails
  # closed with a ::error:: annotation, per REL ("swiftlint missing
  # must FAIL, not pass") + E-39b601 anti-silence tradition. Avoids
  # the silent-pass regression path if the runner image ever drops the
  # pre-installed copy.
  swiftlint:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      # 2026-10-01 (v2.9.5 tag run): the macos-latest runner image dropped
      # its pre-installed SwiftLint and the presence canary fired exactly
      # as designed ("swiftlint not installed on runner" — P2-18's
      # fail-closed path). Every macos-latest job went red across all
      # branches. Pin the release explicitly instead of trusting the
      # runner image: also closes code-review-2026-10-01 P2-2
      # ("SwiftLint/SwiftFormat 无版本 pin") — the runner image was an
      # unpinned floating version all along. Version assertion keeps the
      # fail-closed tradition: a wrong/missing binary still fails loud.
      - name: Install SwiftLint (pinned)
        env:
          SWIFTLINT_VERSION: "0.65.1"
          # SHA-256 of the 0.65.1 portable_swiftlint.zip release asset:
          # closes the download-tampering gap flagged by the 2026-10-01
          # pre-push review (version assertion alone proves "running
          # 0.65.1", not "binary untampered").
          SWIFTLINT_ZIP_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o /tmp/portable_swiftlint.zip
          echo "${SWIFTLINT_ZIP_SHA256}  /tmp/portable_swiftlint.zip" | shasum -a 256 -c -
          mkdir -p /tmp/swiftlint-bin
          unzip -oq /tmp/portable_swiftlint.zip -d /tmp/swiftlint-bin
          sudo install -m 0755 /tmp/swiftlint-bin/swiftlint /usr/local/bin/swiftlint
          installed="$(/usr/local/bin/swiftlint version)"
          echo "SwiftLint ${installed} (pinned ${SWIFTLINT_VERSION})"
          if [[ "$installed" != "$SWIFTLINT_VERSION" ]]; then
            echo "::error::SwiftLint version drift: got ${installed}, pinned ${SWIFTLINT_VERSION}"
            exit 1
          fi
      - name: SwiftLint (P2-18)
        # Absolute path on purpose: a Homebrew /opt/homebrew/bin/swiftlint
        # earlier in PATH would otherwise shadow the pinned binary and the
        # lint would run an uncontrolled version. (Known tradeoff, per the
        # 2026-10-01 pre-push review: dependabot's github-actions ecosystem
        # does not track env-var pins — bump SWIFTLINT_VERSION manually or
        # via a scheduled workflow when 0.65.x moves.)
        run: /usr/local/bin/swiftlint lint --config .swiftlint.yml --reporter github-actions-logging
