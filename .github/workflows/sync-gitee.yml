name: Sync Gitee mirror

# Split out from release.yml on 2026-08-06 so the operator can re-run only
# the Gitee sync step via `gh workflow run sync-gitee.yml -f version=vX.Y.Z`
# without re-triggering the full release pipeline (10-20 min build + sign +
# upload). Manual trigger is the documented recovery path for the two
# failure modes we already saw:
#
#   1. Claude Code sandbox / restricted CI runners hitting GitHub Releases
#      CDN at ~22KB/s — a 7 MB tarball exceeds the 5-min bash timeout.
#   2. Gitee-side flakiness (token revoked, repo temporarily 403) — the
#      push-only release.yml Sync Gitee step's failure surfaces AS a red
#      GitHub release run, which is misleading (the GitHub release IS
#      already live). Splitting it into its own workflow makes the failure
#      boundary honest: sync failure = mirror lags, not release broken.

on:
  workflow_dispatch:
    inputs:
      version:
        # No leading 'v' — the script adds it. Must already be a published
        # GitHub release (sync downloads the tarball from the release URL).
        description: 'Version to sync (e.g. 2.7.9). Already-released GitHub tag required.'
        required: true
        type: string
  # RACE-FIX v2 (2026-08-07): trigger ONLY after release.yml completes
  # successfully. The previous `push: tags` trigger fired sync in
  # parallel with release.yml; if the GitHub release assets weren't yet
  # public when sync ran (slow CI / GH CDN blip), the sync would fail
  # and nothing would re-trigger it until the next tag push. workflow_run
  # is the only event that crosses workflows — concurrency groups don't.
  #
  # `types: [completed]` is as narrow as the trigger itself gets: the
  # event carries no conclusion filter, so a failed or cancelled
  # release.yml fires this too. The "successfully" half of the intent is
  # enforced by the job-level `if:` below — see the comment there.
  workflow_run:
    workflows: [Release]
    types: [completed]

# Same group as release.yml — this serializes multiple sync-gitee runs
# (so a manual re-run doesn't fight an in-flight sync). With the
# workflow_run trigger, runs typically serialize naturally anyway
# (release.yml takes 4-5 min, sync waits then runs once). Kept as
# defense against a manual re-run arriving during an in-flight sync.
# `cancel-in-progress: false`: never cancel a sync mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sync-gitee-mirror:
    runs-on: macos-latest
    # The `workflow_run` trigger above fires on ANY completion of
    # release.yml, including failure and cancellation — the event type has
    # no conclusion filter, so the "…completes successfully" half of the
    # RACE-FIX v2 intent has to be enforced here. Without this the sync
    # runs against a release whose assets were never published, burns the
    # full retry ladder on 404s, and (since 2026-08-11) files a spurious
    # failure issue for a release that was never made.
    #
    # The condition is written as "not workflow_run OR succeeded" so
    # workflow_dispatch keeps working: manual recovery runs must stay
    # available precisely when the automatic path has failed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # PERMISSIONS (2026-08-11 audit): this repo's default workflow token is
    # read-only (`gh api repos/OWNER/REPO/actions/permissions/workflow` →
    # {"default_workflow_permissions":"read"}), so the two issue steps below
    # were silently 403-ing: `gh issue create` never created anything and
    # `gh issue list --label sync-gitee-failure --state all` returned 0 rows
    # since the FEEDBACK-2026-08-10 mechanism shipped. Declaring the scopes
    # explicitly is required — the auto-issue alert was inert without it.
    # `contents: read` is restated because naming any scope drops all others
    # to none, and checkout needs read.
    permissions:
      contents: read
      issues: write
    # Timeout budget (2026-08-11 audit): the previous 15 min could not fit
    # the RETRY v2 ladder, so a persistently-failing sync got cancelled
    # mid-retry and never reached the "Open GH issue" step — the exact
    # alert path this workflow exists to provide (observed: run
    # 31399650001, cancelled at 15m29s).
    #
    #   worst case per attempt = ~3 min tarball download
    #                          + 600 s upload cap (curl --max-time in
    #                            Scripts/sync_gitee_release.sh)
    #                          ≈ 13 min
    #   4 attempts + 210 s backoff ladder (0/30/60/120) ≈ 55 min
    #
    # 60 min covers the full pessimistic ladder so the failure path always
    # runs to completion and files the issue. This costs nothing on the
    # happy path: a successful sync exits in ~5 min. If mirror runs ever
    # need to be cheaper, lower the script's upload --max-time (which
    # bounds each attempt) rather than this ceiling (which only ever bites
    # when something is already wrong).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 so the local appcast.xml matches origin/main
          # (the script reads it and rewrites github.com enclosures →
          # gitee.com). Without this, a tag-only checkout has no appcast
          # <item> yet for the sync script to derive the Gitee copy from.
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Three trigger paths:
          #   - workflow_dispatch: operator passes version via `inputs.version`
          #   - push: tags / push: branches (legacy, still kept as defense):
          #     GITHUB_REF_NAME is the ref that triggered (tag or branch)
          #   - workflow_run (RACE-FIX v2, 2026-08-07): triggered after
          #     release.yml completes — GITHUB_REF_NAME is the REF THAT
          #     TRIGGERED THE WORKFLOW (release.yml's ref, typically `main`),
          #     NOT the tag. The fix: read the latest semver tag via
          #     `git describe --tags`. RACE-FIX v3 (2026-08-08): this
          #     step was previously broken because the `else` branch only
          #     handled push-trigger semantics; on workflow_run it produced
          #     VERSION="main" → sanity check failed → Sync Gitee step
          #     skipped → Gitee mirror lagged.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # checkout step above has fetch-depth: 0 → tags are local.
            VERSION="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//')"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Basic sanity (the script does its own validation but a clearer
          # early error message beats a deeper one).
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version '$VERSION' (expected X.Y.Z, no leading v)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Syncing v${VERSION} → Gitee mirror"

      - name: Sync Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        id: sync
        # RETRY v2 (2026-08-10): bump from 2 to 4 attempts with exponential
        # backoff (30s / 60s / 120s = ~3.5min total wall time) to absorb the
        # transient Gitee-side failures we saw on the v2.8.2 sync attempt
        # (SSL connection timeout on attempt 2 after a token-permission
        # blip on attempt 1). Each retry has a distinct failure mode
        # captured in the step summary, so an operator looking at the run
        # knows whether the failure was consistent (network issue, escalate)
        # or transient (likely self-resolves by retry).
        run: |
          set -euo pipefail
          ATTEMPTS=4
          BACKOFFS=(0 30 60 120)
          for i in $(seq 1 $ATTEMPTS); do
            BACKOFF=${BACKOFFS[$((i-1))]}
            if [ "$BACKOFF" -gt 0 ]; then
              echo "::group::Sync attempt $i/$ATTEMPTS (backoff ${BACKOFF}s)"
              sleep "$BACKOFF"
            else
              echo "::group::Sync attempt $i/$ATTEMPTS"
            fi
            if Scripts/sync_gitee_release.sh "v${{ steps.version.outputs.version }}"; then
              echo "::endgroup::"
              echo "✅ sync succeeded on attempt $i"
              exit 0
            fi
            echo "::endgroup::"
          done
          echo "❌ Sync failed after $ATTEMPTS attempts"
          exit 1

      - name: Verify Gitee sync
        # Cheap post-sync checks (a, b, d from the handoff doc). Run even
        # on push triggers — the script is idempotent so a re-run after a
        # partial failure should land clean. We don't enforce c (download
        # speed) — that's a measurement, not a property.
        #
        # ORDERING (2026-08-11 drill): this used to be the LAST step, after
        # the alerting steps. Since `if: failure()` reads the job status at
        # the moment the step is evaluated, a run where sync "passed" but
        # verification failed skipped both alert steps and still ran
        # `Auto-close` — closing a legitimate open alert while the mirror
        # was broken. Verification has to fail BEFORE the steps that react
        # to failure. Observed live in run 31453166197.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="v${{ steps.version.outputs.version }}"
          OWNER="${GH_OWNER:-irykelee}"
          REPO="${GH_REPO:-clipmemory}"
          API="https://gitee.com/api/v5"
          WORK=$(mktemp -d)

          FAILS=0
          fail() { echo "❌ $*"; FAILS=$((FAILS+1)); }
          ok()   { echo "✅ $*"; }

          echo "=== Post-sync verification for ${VERSION} ==="

          # (a) Gitee release exists.
          # Gitee answers a MISSING tag with HTTP 200 and a literal `null`
          # body, so `curl -sf` (status-only) reported success for a release
          # that does not exist — verified in the drill against tag v9.9.9,
          # which Gitee has never had. Check the body, not the status.
          GITEE_REL=$(curl -sf --max-time 15 "${API}/repos/${OWNER}/${REPO}/releases/tags/${VERSION}?access_token=${GITEE_TOKEN}" || echo "")
          if [[ -n "$GITEE_REL" && "$GITEE_REL" != "null" ]]; then
            ok "Gitee release ${VERSION} exists"
          else
            fail "Gitee release ${VERSION} missing — re-run sync_gitee_release.sh"
          fi

          # (b) Gitee appcast <item> enclosure points to gitee.com (not
          # github.com). Fetch via raw, parse the <enclosure url="..."> for
          # this version. Item title is "Version 2.7.9" (not "ClipMemory
          # v2.7.9" — that's the channel title); we anchor on
          # <sparkle:shortVersionString>2.7.9</sparkle:shortVersionString>
          # which is the authoritative version match.
          V="${VERSION#v}"
          # `-L` follows the 302 redirect to raw.giteeusercontent.com (otherwise
          # curl gets the HTML redirect page and the regex finds no <enclosure>).
          ENCLOSURE=$(V="$V" curl -sfL --max-time 15 "https://gitee.com/${OWNER}/${REPO}/raw/main/appcast.xml" \
            | V="$V" python3 -c 'import re,sys,os; v=os.environ["V"]; m=re.search(r"""<item>.+?<sparkle:shortVersionString>"""+re.escape(v)+r"""</sparkle:shortVersionString>.+?<enclosure[^>]*url="([^"]+)""", sys.stdin.read(), re.DOTALL); print(m.group(1) if m else "")' 2>/dev/null || echo "")
          if [[ -z "$ENCLOSURE" ]]; then
            fail "no Gitee appcast <item> for ${VERSION} — script may not have pushed the copy"
          elif [[ "$ENCLOSURE" == *"gitee.com/${OWNER}/${REPO}/releases/download/${VERSION}/ClipMemory.tar.gz"* ]]; then
            ok "Gitee enclosure → gitee.com (.../releases/download/${VERSION}/ClipMemory.tar.gz)"
          else
            fail "Gitee enclosure unexpected: $ENCLOSURE"
          fi

          # (d) Two-side sha256 identical (REL-29 byte-consistency proof).
          # Download to FILES and require both to be non-empty before
          # comparing. Piping curl straight into shasum meant a failed
          # download hashed an empty stream, and when BOTH sides failed the
          # two empty-file hashes matched — the check reported
          # "✅ sha256 GH == GT (e3b0c44…)" for a release that existed on
          # neither side (drill, run 31453166197). e3b0c44… IS the empty
          # hash; the old comment even named it while the code let it pass.
          # Field-name fallback (attachments vs assets) because the Gitee
          # API returns different field names depending on auth context
          # (verified empirically: with token = attachments; without = assets).
          # `-L` follows the 302 to the S3-backed release-assets host.
          GH_TARBALL="${WORK}/gh-ClipMemory.tar.gz"
          GT_TARBALL="${WORK}/gt-ClipMemory.tar.gz"
          curl -sfL --max-time 60 -o "$GH_TARBALL" "https://github.com/${OWNER}/${REPO}/releases/download/${VERSION}/ClipMemory.tar.gz" || true
          GT_URL=$(printf '%s' "${GITEE_REL:-}" \
            | python3 -c 'import json,sys; raw=sys.stdin.read().strip(); d=json.loads(raw) if raw and raw!="null" else {}; items=(d.get("attachments") or d.get("assets") or []) if isinstance(d,dict) else []; print(next((a["browser_download_url"] for a in items if a.get("name")=="ClipMemory.tar.gz"), ""))' 2>/dev/null || echo "")
          if [[ -n "$GT_URL" ]]; then
            curl -sfL --max-time 60 -o "$GT_TARBALL" "$GT_URL" || true
          fi
          if [[ ! -s "$GH_TARBALL" || ! -s "$GT_TARBALL" ]]; then
            fail "tarball download empty or missing (GH=$(wc -c < "$GH_TARBALL" 2>/dev/null || echo 0)B / GT=$(wc -c < "$GT_TARBALL" 2>/dev/null || echo 0)B) — asset missing on one side"
          else
            GH_SHA=$(shasum -a 256 "$GH_TARBALL" | awk '{print $1}')
            GT_SHA=$(shasum -a 256 "$GT_TARBALL" | awk '{print $1}')
            if [[ "$GH_SHA" == "$GT_SHA" ]]; then
              ok "sha256 GH == GT ($GH_SHA)"
            else
              fail "sha256 mismatch: GH=$GH_SHA GT=$GT_SHA — REL-29 byte-consistency violated"
            fi
          fi

          rm -rf "$WORK"
          if [[ "$FAILS" -gt 0 ]]; then
            echo ""
            echo "❌ ${FAILS} post-sync check(s) FAILED."
            exit 1
          fi
          echo ""
          echo "✅ All post-sync verification checks passed."

      - name: Failure summary
        # VISIBILITY (2026-08-07): when this workflow fails (sync or verify),
        # post a GitHub step summary so the failure mode + manual recovery
        # command is visible at a glance in the Actions tab. Combined with
        # GitHub's built-in "send notifications for failed workflows" email
        # toggle (per-user GH setting), this gives the operator proactive
        # awareness instead of "didn't notice Gitee was stuck on 2.7.9".
        if: failure()
        run: |
          {
            echo "## ❌ Gitee mirror sync failed for v${{ steps.version.outputs.version }}"
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Recovery"
            echo ""
            echo "Manual re-run (idempotent — script will skip already-pushed assets):"
            echo '```'
            echo "gh workflow run sync-gitee.yml -f version=v${{ steps.version.outputs.version }}"
            echo '```'
            echo ""
            echo "If GitHub Release assets are not yet public (release.yml still running),"
            echo "wait a few minutes before retrying so the asset upload completes first."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open GH issue on persistent failure
        # FEEDBACK (2026-08-10): when sync-gitee fails after all retries,
        # proactively open a GitHub Issue so the failure is visible without
        # anyone having to remember to check the Actions tab. The issue
        # body captures run URL, failure context, and the recovery command
        # so the next maintainer (human or AI) sees the alert immediately
        # when opening the repo or scrolling notifications. Deduplicated by
        # an `sync-gitee-failure` label so a persistent failure across
        # multiple runs doesn't spam new issues; existing open issue is
        # updated with the latest run link instead.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="v${{ steps.version.outputs.version }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LABEL="sync-gitee-failure"
          ISSUE_TITLE="Gitee sync failed for ${VERSION}"

          # Dedupe per VERSION, not per label. Picking `.[0]` of everything
          # carrying the label meant a still-open issue from an older
          # version got its body overwritten with this version's details
          # while its title kept naming the old one — so the alert lied
          # about which release was stuck, and the auto-close step below
          # (which matches on title) could never find it again. Matching
          # the exact title on both sides keeps open/update/close coherent.
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number,title \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" 2>/dev/null | head -1 || echo "")
          BODY="## Gitee mirror sync failed for ${VERSION}

          Run: ${RUN_URL}

          This issue auto-opened by \`.github/workflows/sync-gitee.yml\` after all retries failed.
          A new run will update this issue body with the latest run link instead of creating
          a duplicate.

          ### Recovery

          \`\`\`bash
          # Manual re-run (idempotent — script skips already-pushed assets):
          gh workflow run sync-gitee.yml -f version=${VERSION#v}
          \`\`\`

          If GitHub Release assets are not yet public, wait a few minutes before retrying.

          ---
          _Last sync run: ${RUN_URL}_"

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY" --add-label "$LABEL"
            echo "ISSUE_URL=https://github.com/${{ github.repository }}/issues/$EXISTING" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Opening new issue"
            NEW_URL=$(gh issue create --title "$ISSUE_TITLE" --body "$BODY" --label "$LABEL")
            echo "ISSUE_URL=$NEW_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Auto-close on next successful run
        # If this run succeeded after a previous failure, find any auto-opened
        # issue for this version and comment + close. Keeps the issue list
        # clean without manual cleanup.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LABEL="sync-gitee-failure"
          VERSION="v${{ steps.version.outputs.version }}"
          ISSUE_TITLE="Gitee sync failed for ${VERSION}"
          # `--search "… in:"` left a dangling qualifier (`in:` with no
          # field), which GitHub search does not interpret as "match this
          # title" — it degraded to a loose full-text match that could
          # close an issue for a different version. Filter the label's open
          # issues on exact title instead; same predicate the open/update
          # step above uses.
          for ISSUE_NUM in $(gh issue list --label "$LABEL" --state open --json number,title \
                  --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" 2>/dev/null); do
            echo "Closing auto-issue #$ISSUE_NUM (sync succeeded this run)"
            gh issue close "$ISSUE_NUM" --comment "Auto-closing: sync succeeded for ${VERSION} on run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
